#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pmwiki"
name = "PmWiki"
description.en = "Wiki-based CMS for collaborative creation and maintenance of websites"
description.fr = "Wiki pour la création et l'entretien collectif de sites Internet"

version = "2.7.8~ynh1"

maintainers = [ ]

[upstream]
license = "GPL-2.0-only"
website = "https://www.pmwiki.org"
admindoc = "https://www.pmwiki.org/wiki/PmWikiFr/PmWikiFr"
userdoc = "https://www.pmwiki.org/wiki/PmWikiFr/PmWikiUsers"

[integration]
yunohost = ">= 12.0.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/pmwiki"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]
    [resources.sources]
    [resources.sources.main]
    url = "https://www.pmwiki.org/downloads/pmwiki/pmwiki-2.7.8.zip"
    sha256 = "3a535980ff841366263a229e9f942f6143970ac952a36e0dfb3e36d36a21d3e7"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.5-fpm"
